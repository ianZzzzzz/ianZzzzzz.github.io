name: Tokyo lens guide - prepare real photos
on:
  push:
    paths:
      - '.github/workflows/tokyo-lens-guide-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet Pillow requests
      - name: Fetch and validate the six reference photographs
        run: |
          python - <<'PY'
          import io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps
          root = Path('tokyo-lens-guide/assets')
          root.mkdir(parents=True, exist_ok=True)
          sources = [
            ('minolta58', 'https://fangzhoujiang.wordpress.com/wp-content/uploads/2017/04/lens2.jpg?w=1000', 'Fang-Zhou Jiang', 'https://fangzhoujiang.wordpress.com/2017/04/16/minolta-mc-rokkor-pf-58mm-1-4-bokehlicious-machine-from-70s/'),
            ('minolta58-sample', 'https://fangzhoujiang.wordpress.com/wp-content/uploads/2017/04/dscf8499.jpg?w=1000', 'Fang-Zhou Jiang', 'https://fangzhoujiang.wordpress.com/2017/04/16/minolta-mc-rokkor-pf-58mm-1-4-bokehlicious-machine-from-70s/'),
            ('konica40', 'https://phillipreeve.net/blog/wp-content/uploads/2023/04/DSC_3528.jpg', 'Martin / phillipreeve.net', 'https://phillipreeve.net/blog/konica-hexanon-ar-40mm-f1-8/'),
            ('konica40-sample', 'https://phillipreeve.net/blog/wp-content/uploads/2023/04/DSC_1252.jpg', 'Martin / phillipreeve.net', 'https://phillipreeve.net/blog/konica-hexanon-ar-40mm-f1-8/'),
            ('konica57', 'https://thenoisyshutter.com/wp-content/uploads/2023/05/DSC5868web.jpg', 'BSmith / The Noisy Shutter', 'https://thenoisyshutter.com/2023/05/28/legacy-lens-review-konica-hexanon-ar-57mm-f1-4/'),
            ('konica57-sample', 'https://thenoisyshutter.com/wp-content/uploads/2023/05/Jack-Asleep-1024x682.jpg', 'BSmith / The Noisy Shutter', 'https://thenoisyshutter.com/2023/05/28/legacy-lens-review-konica-hexanon-ar-57mm-f1-4/')
          ]
          manifest = []
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (compatible; TokyoLensReferenceGuide/1.0)'})
          for key, url, author, page in sources:
            for attempt in range(3):
              try:
                response = session.get(url, timeout=35)
                response.raise_for_status()
                if len(response.content) > 20000000:
                  raise ValueError('Unexpectedly large image')
                image = ImageOps.exif_transpose(Image.open(io.BytesIO(response.content))).convert('RGB')
                image.thumbnail((1100, 1100))
                target = root / (key + '.jpg')
                image.save(target, 'JPEG', quality=84, optimize=True)
                manifest.append({'id': key, 'file': target.name, 'source': url, 'source_page': page, 'credit': author, 'width': image.width, 'height': image.height, 'bytes': target.stat().st_size})
                print('PHOTO_OK', key, image.size, target.stat().st_size)
                break
              except Exception as error:
                print('PHOTO_RETRY', key, attempt + 1, str(error)[:160])
                if attempt == 2:
                  raise
                time.sleep(3)
          (root / 'sources.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          for url in ['https://ianzzzzzz.github.io/', 'https://ianzheng.me/', 'https://raw.githack.com/ianZzzzzz/ianZzzzzz.github.io/master/index.html']:
            try:
              r = session.get(url, timeout=20)
              print('HOST_PROBE', r.status_code, r.url, r.headers.get('content-type'), len(r.content))
            except Exception as error:
              print('HOST_PROBE_ERROR', url, str(error)[:180])
          PY
      - name: Save photos in the guide directory only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokyo-lens-guide/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified reference photographs to Tokyo lens guide'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Export photo assets
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-lens-photos
          path: tokyo-lens-guide/assets
          retention-days: 7
